<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plotted — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FAF6EC;
        color: #2B2A24;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 2rem;
        text-align: center;
      }
      .wordmark {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 2rem;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        max-width: 28ch;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="wordmark">Plotted</div>
    <p>You&rsquo;re offline &mdash; connect to wifi to view your garden</p>
  </body>
</html>
